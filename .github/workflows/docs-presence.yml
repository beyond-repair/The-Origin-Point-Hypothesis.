name: docs-presence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: required claim-cap files exist
        run: |
          test -f README.md
          test -f CLAIM_STATUS.md
          test -f GOVERNANCE.md
          test -f SECURITY.md
          test -f origin-point-core.tex
          test -s "The Origin Point Hypothesis.pdf"
          grep -q RESEARCH README.md
          grep -q UNSUPPORTED CLAIM_STATUS.md
          grep -q UNSUPPORTED origin-point-core.tex
          grep -q 'n-3' README.md
          grep -q 'Not a SPARC' README.md
          ! grep -q "validated against SPARC" origin-point-core.tex
      - name: claim-cap tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_claim_cap.py
